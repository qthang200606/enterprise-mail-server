## ==============================================================================
## Dovecot Authentication Configuration
## Đồ án: Enterprise Mail Server (VKU Office)
## Phụ trách: Thành viên 3 (TV3) - IMAP / Authentication / Mailbox
## ==============================================================================

# ------------------------------------------------------------------------------
# 1. Chính sách bảo mật xác thực (Security Policy)
# ------------------------------------------------------------------------------
# Bắt buộc bảo vệ mật khẩu: CẤM truyền mật khẩu dạng rõ (plaintext) qua các
# kết nối không được mã hóa SSL/TLS.
#
# Yêu cầu bảo mật:
# - Giữ disable_plaintext_auth = yes để bảo vệ an toàn toàn bộ hệ thống mạng LAN.
# - Tuyệt đối không bật disable_plaintext_auth = no.
# - Không sử dụng login_trusted_networks để miễn trừ kiểm tra mã hóa.
# - Client (bao gồm Thunderbird/Outlook và Roundcube Webmail) cần sử dụng kết nối
#   được bảo vệ bởi TLS (STARTTLS trên cổng 143 hoặc IMAPS trên cổng 993).
disable_plaintext_auth = yes

# ------------------------------------------------------------------------------
# 2. Cơ chế xác thực (Authentication Mechanisms)
# ------------------------------------------------------------------------------
# Hỗ trợ cơ chế PLAIN và LOGIN (chuẩn giao tiếp của SASL và Webmail/Client)
auth_mechanisms = plain login

# ------------------------------------------------------------------------------
# 3. Định dạng và chuẩn hóa tên đăng nhập (Username Formatting)
# ------------------------------------------------------------------------------
# Chuyển toàn bộ tên đăng nhập sang chữ thường (lowercase)
auth_username_format = %Lu

# ------------------------------------------------------------------------------
# 4. Cơ sở dữ liệu người dùng và mật khẩu (User & Password Databases)
# ------------------------------------------------------------------------------
# Sử dụng tài khoản hệ thống Linux (PAM / /etc/passwd / /etc/shadow)
# Hoàn toàn khớp với danh sách tài khoản demo do TV1 khởi tạo qua `setup-users.sh`:
# admin, giamdoc, nhansu, ketoan, nhanvien
!include auth-system.conf.ext
