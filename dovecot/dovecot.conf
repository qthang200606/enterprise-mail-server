## ==============================================================================
## Dovecot Main Configuration File
## Đồ án: Enterprise Mail Server (VKU Office)
## Phụ trách: Thành viên 3 (TV3) - IMAP / Authentication / Mailbox
## ==============================================================================

# 1. Giao thức hoạt động:
# Theo yêu cầu kiến trúc của nhóm, chỉ kích hoạt duy nhất giao thức IMAP.
# Không kích hoạt POP3 và LMTP để tránh mở dịch vụ thừa và giảm bề mặt tấn công.
protocols = imap

# 2. Giao diện mạng lắng nghe kết nối:
# Lắng nghe trên toàn bộ các giao diện IPv4 (*) và IPv6 (::)
listen = *, ::

# 3. Thông điệp chào mừng khi client kết nối tới dịch vụ IMAP:
login_greeting = VKU Office Mail Server (Dovecot IMAP) ready.

# 4. Thiết lập thư mục cơ sở cho dữ liệu runtime
#base_dir = /var/run/dovecot/

# 5. Thiết lập từ điển tra cứu (Dictionary settings)
dict {
  #quota = mysql:/etc/dovecot/dovecot-dict-sql.conf.ext
}

# 6. Nạp toàn bộ các tệp cấu hình module từ thư mục conf.d/
# Thứ tự nạp dựa theo mã ASCII của tên file (ví dụ: 10-auth.conf, 10-mail.conf, ...)
!include conf.d/*.conf

# 7. Nạp cấu hình ghi đè cục bộ (nếu có)
!include_try local.conf
