## ==============================================================================
## Dovecot Mailbox Location and Namespace Configuration
## Đồ án: Enterprise Mail Server (VKU Office)
## Phụ trách: Thành viên 3 (TV3) - IMAP / Authentication / Mailbox
## ==============================================================================

# ------------------------------------------------------------------------------
# 1. Định dạng và vị trí lưu trữ hộp thư (Mailbox Location)
# ------------------------------------------------------------------------------
# Sử dụng định dạng Maildir tại thư mục gốc của từng người dùng Linux (~/Maildir).
#
# Lý do kỹ thuật:
# - Khớp hoàn toàn với script hạ tầng `scripts/setup-users.sh` của TV1 (đã khởi tạo
#   sẵn ~/Maildir/cur, ~/Maildir/new, ~/Maildir/tmp với quyền chmod 700).
# - Tránh hiện tượng tranh chấp khóa file (file locking) thường gặp của định dạng Mbox.
# - Đảm bảo khả năng đọc/ghi độc lập, an toàn khi Postfix phân phối thư và Dovecot truy xuất.
#
# Đề xuất cho TV2 (Postfix): Thêm chỉ thị `home_mailbox = Maildir/` trong postfix/main.cf.
mail_location = maildir:~/Maildir

# ------------------------------------------------------------------------------
# 2. Phân quyền và nhóm truy cập Mailbox (Permissions & Groups)
# ------------------------------------------------------------------------------
# Nhóm đặc quyền mail hệ thống (chuẩn trên Ubuntu là mail)
mail_privileged_group = mail

# UID tối thiểu cho phép đăng nhập và truy cập hộp thư (ngăn tài khoản daemon/root)
# Trên Ubuntu Server, tài khoản người dùng thông thường bắt đầu từ UID 1000
first_valid_uid = 1000

# ------------------------------------------------------------------------------
# 3. Không gian tên hộp thư (Mailbox Namespaces)
# ------------------------------------------------------------------------------
namespace inbox {
  # Đánh dấu đây là namespace chính chứa INBOX
  inbox = yes

  # Tiền tố thư mục (để trống nghĩa là các thư mục nằm ngay cấp gốc của Maildir)
  prefix =

  # Ký tự phân cách thứ bậc thư mục trong giao thức IMAP
  separator = /

  # Tự động khởi tạo và gán cờ special-use cho các thư mục chuẩn theo RFC 6154.
  # Thống nhất tên duy nhất 'Sent' cho thư mục thư đã gửi (đồng bộ với Roundcube Webmail),
  # tránh khai báo trùng lặp 'Sent Messages' gây xung đột thư mục trên client.
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
}
