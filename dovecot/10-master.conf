## ==============================================================================
## Dovecot Master Process Configuration
## Đồ án: Enterprise Mail Server (VKU Office)
## Phụ trách: Thành viên 3 (TV3) - IMAP / Authentication / Mailbox
## ==============================================================================

# Cấu hình giới hạn tài nguyên và tiến trình mặc định
#default_process_limit = 100
#default_client_limit = 1000
#default_vsz_limit = 256M

# ------------------------------------------------------------------------------
# 1. Dịch vụ IMAP (imap-login)
# ------------------------------------------------------------------------------
service imap-login {
  # Cổng chuẩn IMAP (hỗ trợ STARTTLS nâng cấp bảo mật)
  inet_listener imap {
    port = 143
  }

  # Cổng chuẩn IMAPS (IMAP qua SSL/TLS trực tiếp)
  # Quyết định kích hoạt: Cổng 993 chỉ được phép lắng nghe khi hệ thống có chứng
  # chỉ và khóa riêng tư TLS hợp lệ. Nếu chưa có TLS hợp lệ, script cài đặt
  # sẽ đặt port = 0 để vô hiệu hóa cổng này, bảo đảm không gây crash dịch vụ.
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# ------------------------------------------------------------------------------
# 2. Đóng các dịch vụ không sử dụng (POP3, Submission, LMTP)
# Theo yêu cầu kiến trúc của nhóm, chỉ phục vụ IMAP
# ------------------------------------------------------------------------------
service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 0
  }
}

service submission-login {
  inet_listener submission {
    port = 0
  }
}

# ------------------------------------------------------------------------------
# 3. Quá trình xử lý phiên IMAP (imap)
# ------------------------------------------------------------------------------
service imap {
  # Giữ cấu hình mặc định an toàn cho tiến trình IMAP
  #process_limit = 1024
}

# ------------------------------------------------------------------------------
# 4. Tích hợp xác thực Postfix SMTP qua Dovecot SASL (service auth)
# ------------------------------------------------------------------------------
service auth {
  # auth-userdb: Socket nội bộ dành cho các tiến trình Dovecot (dovecot-lda, doveadm, imap).
  # Giữ nguyên cấu hình mặc định của Ubuntu package: không mở mode 0666 không cần thiết,
  # để Dovecot áp dụng cơ chế xác thực nội bộ an toàn.
  unix_listener auth-userdb {
    #mode = 0666
    #user = 
    #group =
  }

  # UNIX socket phục vụ xác thực SASL cho dịch vụ Postfix SMTP.
  # Đường dẫn này tương ứng với cấu hình trong `postfix/main.cf` của TV2:
  #   smtpd_sasl_type = dovecot
  #   smtpd_sasl_path = private/auth
  # Postfix chạy chroot dưới /var/spool/postfix nên socket đặt tại
  # /var/spool/postfix/private/auth sẽ được Postfix truy xuất qua private/auth.
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# ------------------------------------------------------------------------------
# 5. Tiến trình Auth Worker (chạy quyền root để truy cập /etc/shadow qua PAM)
# ------------------------------------------------------------------------------
service auth-worker {
  user = root
}

# ------------------------------------------------------------------------------
# 6. Dịch vụ tra cứu từ điển (dict)
# ------------------------------------------------------------------------------
service dict {
  unix_listener dict {
    #mode = 0600
    #user = 
    #group = 
  }
}
